# Server settings
server.address=0.0.0.0
server.port=8083
server.servlet.context-path=/api

# Application name
spring.application.name=dis-news-service

## Database
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/dis_news?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ulaanbaatar}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.url=jdbc:mysql://172.16.0.19:3306/dis_news?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ulaanbaatar
spring.datasource.username=root
spring.datasource.password=root123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Static resources & encoding
spring.web.resources.static-locations=classpath:/static/
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Машины захиалга — албаны баталгаажуулалт алгасах
# Эдгээр хэрэглэгчийн суудлын машины хүсэлт шууд автобаазын хуваарилалт руу орно
# (автобаазын дарга баталгаажуулаад хувиарлана).
# ТЭМДЭГЛЭЛ: алгасах хэрэглэгчийн жагсаалт одоо vehicle_approval_skip хүснэгтээс
# (="Эрхийн удирдлага" цэс) уншигдана — доорх user-ids property ашиглагдахаа больсон.
# Албан тушаалаар алгасуулах шаардлагатай бол (хоосон = ашиглахгүй)
vehicle-order.dept-approval-skip.position-ids=

# ── Jasper тайлангийн сервис (PDF рендер) ──────────────────────────────────────
# client-secret-ийг env-ээр (JASPER_CLIENT_SECRET) өгнө. Загварын КОД хатуу default.
jasper.base-url=${JASPER_BASE_URL:http://172.16.0.101:8082}
jasper.client-key=${JASPER_CLIENT_KEY:erp-canteen-backend}
jasper.client-secret=${JASPER_CLIENT_SECRET:ErpCanteen_2026Secret!}
jasper.briefing-fulfillment-template-code=${JASPER_BRIEFING_FULFILLMENT_TEMPLATE_CODE:BRIEFING_FULFILLMENT}

# Topbar "ERP" товч — нэвтэрсэн чигээр ERP руу (AuthController /auth/erp-sso, sso_ticket)
erp.app-url=${ERP_APP_URL:https://erp.usug.mn}
